_target_: src.models.defile_module.DefileLitModule
_convert_: object

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.005881046823535977
  weight_decay: 0.03868890090567428

scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  _partial_: true
  mode: min
  factor: 0.1
  patience: 5

net:
  _target_: src.models.components.unet.UNetplus
  # `2*len(history_windows)+2*history_cumulative` is the history-channel count
  # (value + observed-hours per window/cumulative -- see src.data.history), duplicated
  # here as a plain arithmetic expression since a `data.*` key can only be a
  # `DefileDataModule.__init__` kwarg, not a Hydra-only derived value (`data.history_windows`
  # and `data.history_cumulative` are those kwargs; this is not a third one).
  nb_input_features_hourly: ${eval:'4+2*${len:${data.history_windows}}+2*${data.history_cumulative}+${len:${data.era5_main_variables}}+${len:${data.era5_hourly_locations}}*${len:${data.era5_hourly_variables}}'}
  nb_layer_hourly: 2
  nb_hidden_features_hourly: 16
  nb_input_features_daily: ${eval:'2+2*${len:${data.history_windows}}+2*${data.history_cumulative}+${len:${data.era5_daily_locations}}*${len:${data.era5_daily_variables}}'}
  nb_lag_day: ${data.lag_day}
  nb_layer_daily: 6
  nb_hidden_features_daily: 128
  # A second channel used to feed an uncertainty (NLL) term that never received gradient,
  # since alpha=1 everywhere zeroed out its contribution to the loss (DEVELOPMENT.md 4.8).
  # `ProbaRMSE` now only reads channel 0.
  nb_output_features: 1
  dropout: True

criterion:
  # Tweedie alone is the default: it's already a proper scoring rule for zero-inflated
  # skewed counts, with a per-species-tuned p. `ProbaRMSE` (src/models/criterion.py) used to
  # be added on top, but it targeted the same quantity as Tweedie in a way that silently
  # disagreed on peaked days -- now fixed, but its actual benefit here (if any) is untested,
  # so it's left out until an ablation against this baseline says otherwise.
  tweedie:
    _target_: src.models.criterion.TweedieLoss
    alpha: 1
    p: 1.5

# compile model for faster training with pytorch 2.0
compile: false

output_dir: ${paths.output_dir}

# Saliency needs Trainer(inference_mode=False) and a backward-style pass per attributed
# sample; capping it to a subsample of test batches keeps that cost bounded regardless of
# test-set size.
compute_saliency: true
saliency_max_batches: 20
