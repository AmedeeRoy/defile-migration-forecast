_target_: src.data.defile_datamodule.DefileDataModule
data_dir: ${paths.data_dir}

batch_size: 1024 # Needs to be divisible by the number of devices (e.g., if in a distributed setup)

num_workers: 0

species: "Common Buzzard"

era5_main_location: "Defile"
era5_main_variables:
  - "temperature_2m"
  - "dewpoint_temperature_2m"
  - "total_precipitation"
  - "surface_pressure"
  - "u_component_of_wind_10m"
  - "v_component_of_wind_10m"
  - "u_component_of_wind_100m"
  - "v_component_of_wind_100m"
  - "instantaneous_10m_wind_gust"
  - "high_cloud_cover"
  - "low_cloud_cover"
  - "medium_cloud_cover"
  - "total_cloud_cover"
  - "surface_solar_radiation_downwards"

era5_hourly_locations:
  - "MontTendre"
  - "Chasseral"
  - "Basel"
  - "Dijon"
  - "ColGrandSaintBernard"

era5_hourly_variables:
  - "temperature_2m"
  - "dewpoint_temperature_2m"
  - "total_precipitation"
  - "surface_pressure"
  - "u_component_of_wind_10m"
  - "v_component_of_wind_10m"
  - "u_component_of_wind_100m"
  - "v_component_of_wind_100m"
  - "instantaneous_10m_wind_gust"
  - "high_cloud_cover"
  - "low_cloud_cover"
  - "medium_cloud_cover"
  - "total_cloud_cover"
  - "surface_solar_radiation_downwards"

# The far-field locations are back. They used to be excluded because their GEE export came
# from ECMWF/ERA5_LAND/DAILY_AGGR: the CSVs were already daily, named precipitation
# `total_precipitation_sum` (a daily total rather than an hourly rate), and had no hourly
# values to average, so including them crashed the CSV reader and, once past that, would
# have trained on daily sums while serving 24-hour means. Open-Meteo serves hourly data for
# every location from one dataset, and src/data/weather.py applies one explicit aggregation
# rule per variable to both the training and the forecast path, so the mismatch that forced
# them out no longer exists.
era5_daily_locations:
  - "Defile"
  - "Schaffhausen"
  - "Basel"
  - "Munich"
  - "Stuttgart"
  - "Frankfurt"
  - "Berlin"

era5_daily_variables:
  - "temperature_2m"
  - "total_precipitation"
  - "surface_pressure"
  - "u_component_of_wind_10m"
  - "v_component_of_wind_10m"

lag_day: 7
forecast_day: 5
train_val_test_cum_ratio: [0.7, 0.9]
years: ${eval:"list(range(1966, 2026))"}
doy: [196, 335]
train_val_test: "period"
year_used: "constant" # "constant" or "none" or "period"

# Within-season history (src/data/history.py): the "own-site lag" idea from
# DEVELOPMENT.md's Trektellen roadmap, built directly from this species' own earlier rows
# in the same season rather than a separate live feed. `history_windows` is a list of
# trailing-day lag windows (e.g. [1, 3, 7] for yesterday / last 3 days / last week's
# birds/observer-hour rate); `history_cumulative` adds the season-to-date rate. Empty/false
# by default -- a strict no-op reproducing the pre-history model exactly.
history_windows: []
history_cumulative: False

compute_transform_data: True
