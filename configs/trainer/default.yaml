_target_: lightning.pytorch.trainer.Trainer

default_root_dir: ${paths.output_dir}

min_epochs: 1 # prevents early stopping
max_epochs: 50

accelerator: cpu
devices: 1

# mixed precision for extra speed-up
# precision: 16

# perform a validation loop every N training epochs
check_val_every_n_epoch: 1

# Same seed, same config, different outcome was observed directly on this codebase and
# accelerator (trainer=mps): with this False, non-deterministic op ordering means
# seed_everything alone does not make a run reproducible. Makes training somewhat slower,
# but a rerun -- for debugging, or comparing a code change -- needs a stable answer.
deterministic: True

inference_mode: False

log_every_n_steps: 30
