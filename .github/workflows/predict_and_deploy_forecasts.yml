name: Predict & Deploy Forecasts

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # daily at 3 AM

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-deployment"
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    outputs:
      forecasts-path: ${{ steps.set-path.outputs.path }}
      n_forecasts: ${{ steps.predict.outputs.n_forecasts }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install pinned environment
        run: uv sync --locked

      # One process per species rather than one --multirun: Hydra's launcher aborts the
      # whole sweep on the first exception, so one broken species used to publish nothing
      # for all eleven. Failures still fail the job (and trigger GitHub's email), after
      # the species that did succeed have been published.
      - name: Run prediction script
        id: predict
        run: |
          failed=()
          for sp in common_buzzard red_kite black_kite honey_buzzard marsh_harrier sparrowhawk kestrel osprey hen_harrier merlin hobby; do
            uv run python src/predict.py experiment=$sp || failed+=("$sp")
          done
          # Out of season predict.py writes nothing; downstream jobs then skip instead of failing.
          echo "n_forecasts=$(find prod/forecasts -name '*.nc' 2>/dev/null | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Prediction failed for: ${failed[*]}"
            exit 1
          fi

      - name: Set forecasts path
        id: set-path
        run: echo "path=prod/forecasts" >> $GITHUB_OUTPUT

      - name: Upload forecasts artifact
        if: ${{ !cancelled() && steps.predict.outputs.n_forecasts != '0' && steps.predict.outputs.n_forecasts != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: forecasts
          path: prod/forecasts/

  deploy_pages:
    runs-on: ubuntu-latest
    needs: predict
    if: ${{ !cancelled() && needs.predict.outputs.n_forecasts != '0' && needs.predict.outputs.n_forecasts != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download forecasts artifact
        uses: actions/download-artifact@v5
        with:
          name: forecasts
          path: www/img

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./www/"

      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@v4

  upload_gce:
    runs-on: ubuntu-latest
    needs: predict
    if: ${{ !cancelled() && needs.predict.outputs.n_forecasts != '0' && needs.predict.outputs.n_forecasts != '' }}
    steps:
      - name: Download forecasts artifact
        uses: actions/download-artifact@v5
        with:
          name: forecasts
          path: forecasts

      - name: Upload forecasts to GCE
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USER }}
          key: ${{ secrets.GCE_SSH_KEY }}
          port: 22
          source: "forecasts"
          target: "/home/github-actions"
