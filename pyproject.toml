[project]
name = "defile-migration-forecast"
version = "0.1.0"
description = "Forecasts of hourly raptor passage rate at Défilé de l'Écluse"
requires-python = ">=3.10,<3.11"

# Exact pins, matching what this project was actually installed and tested against on the
# retired conda environment (see git history for environment.yaml). This is a tooling swap,
# not a dependency upgrade: loose ranges here would let `uv lock` silently jump to whatever
# is newest at lock time (it already tried to move torch 2.5.1 -> 2.13.0 and pyarrow
# 13.0.0 -> 25.0.0 the first time this was written with open ranges). Bump deliberately,
# with `uv lock --upgrade-package <name>` and a test run, not as a side effect of this
# migration.
dependencies = [
    "torch==2.5.1",
    "lightning==2.5.5",
    "hydra-core==1.3.2",
    "rich==13.9.4",
    "pandas==2.3.3",
    "matplotlib==3.10.3",
    "xarray==2023.6.0",
    "einops==0.8.1",
    "cloudpickle==3.1.1",
    # Parquet engine for the local weather cache (data/weather/), written and read by
    # scripts/build_weather_cache.py and src/data/weather.py.
    "pyarrow==13.0.0",
    "pytest==9.0.3",
    "hydra-optuna-sweeper==1.2.0",
    "hydra-colorlog==1.2.0",
    "rootutils==1.0.7",
    "suncalc==0.1.3",
    "openmeteo-sdk==1.21.2",
    "openmeteo-requests==1.7.3",
    "requests-cache==1.2.1",
    "retry-requests==2.0.0",
    "captum==0.8.0",
    # Pinned directly, not just transitively: requests>=2.32 breaks type-hint resolution
    # somewhere in the requests-cache/openmeteo_requests stack (NameError: name
    # 'RequestsCookieJar' is not defined, from a lazily-evaluated forward reference), which
    # only surfaces at request time, not at import time. 2.31.0 is what this project has
    # actually been tested against.
    "requests==2.31.0",
]

# On Linux (the GitHub Actions runner), pull the CPU-only PyTorch build: configs/predict.yaml
# and configs/trainer/cpu.yaml already run CPU-only in production, so there is no reason to
# pull CUDA wheels there. macOS (local dev) keeps the default PyPI wheel, which is the one
# with Apple-silicon MPS support -- the CPU index does not publish macOS wheels at all.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
